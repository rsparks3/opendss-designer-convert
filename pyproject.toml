[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "opendss-designer-convert"
dynamic = ["version"]
description = "Convert CYME and Synergi Electric distribution models to OpenDSS (a trimmed fork of NREL DiTTo)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["opendss", "cyme", "synergi", "distribution", "power systems", "converter"]
authors = [{ name = "Ryan Sparks" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # The common distribution model every reader fills and the writer reads.
  # Upstream DiTTo breaks on GDM minor releases, so stay within 2.4.x.
  "grid-data-models~=2.4.0",
  "infrasys>=1.2",
  # OpenDSS text serialisation used by the writer.
  "NREL-altdss-schema>=0.0.3,<0.1",
  "pydantic>=2.6",
  "pandas>=2.0",
  "numpy>=1.26",
  # Pure-Python reader for Synergi's Microsoft Access (.mdb) databases.
  "access-parser>=0.0.6",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "opendssdirect.py>=0.9",
]
dev = [
  "opendss-designer-convert[test]",
  "ruff>=0.6",
]

[project.urls]
Upstream = "https://github.com/NREL-Distribution-Suites/ditto"

[project.scripts]
opendss-designer-convert = "opendss_designer_convert.cli:main"

[tool.hatch.version]
path = "src/opendss_designer_convert/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opendss_designer_convert"]

[tool.hatch.build.targets.sdist]
include = ["src/opendss_designer_convert", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning",
  "ignore:Pydantic serializer warnings:UserWarning",
]

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9",  # pycodestyle subset
  "F",               # pyflakes
  "W",               # pycodestyle warnings
  "I",               # import sorting
  "S602", "S604", "S605", "S606", "S607",  # no shells or subprocesses
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
